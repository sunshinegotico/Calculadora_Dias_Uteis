<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead Time Compras</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-100 p-6"><div class="max-w-6xl mx-auto bg-white rounded-2xl shadow p-6"><h1 class="text-3xl font-bold text-indigo-700">Simulador de Lead Time de Compras</h1><div class="grid md:grid-cols-2 gap-4 mt-6"><div><label>Data Inicial</label><input id="start" type="date" class="w-full border p-2 rounded"></div><div><label>Valor do Pedido (R$)</label><input id="valor" type="number" value="50000" class="w-full border p-2 rounded"></div></div><button onclick="calc()" class="mt-4 bg-indigo-600 text-white px-4 py-2 rounded">Calcular</button><div id="resultado" class="mt-6"></div></div><script>function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);return new Date(y,Math.floor((h+l-7*m+114)/31)-1,((h+l-7*m+114)%31)+1)}function holidays(y){let e=easter(y),gf=new Date(e);gf.setDate(e.getDate()-2);return [gf.toDateString(),''+new Date(y,0,1).toDateString()]}function wk(d){return d.getDay()==0||d.getDay()==6}function addBiz(dt,n){let d=new Date(dt);let c=0;while(c<n){d.setDate(d.getDate()+1);if(!wk(d)) c++;}return d}function spot(v){if(v<=10000)return 3;if(v<=50000)return 5;if(v<=100000)return 7;if(v<=500000)return 10;return 15}function consumo(v){if(v<=10000)return 2;if(v<=50000)return 4;if(v<=100000)return 6;if(v<=500000)return 8;return 12}function calc(){let s=new Date(document.getElementById('start').value);let v=Number(document.getElementById('valor').value||0);let f=addBiz(s,20);let m=addBiz(s,7);let rs=addBiz(m,spot(v));let mx=new Date(Math.max(f,rs));let contrato=addBiz(mx,1);let rc=addBiz(contrato,consumo(v));document.getElementById('resultado').innerHTML=`<div class='grid md:grid-cols-5 gap-3'><div class='border p-3 rounded'><b>Fornecedor</b><br>${f.toLocaleDateString('pt-BR')}</div><div class='border p-3 rounded'><b>Material</b><br>${m.toLocaleDateString('pt-BR')}</div><div class='border p-3 rounded'><b>RC Spot</b><br>${rs.toLocaleDateString('pt-BR')}</div><div class='border p-3 rounded'><b>Contrato</b><br>${contrato.toLocaleDateString('pt-BR')}</div><div class='border p-3 rounded'><b>RC Consumo</b><br>${rc.toLocaleDateString('pt-BR')}</div></div><div class='mt-5 text-2xl font-bold text-green-700'>Conclusão do Pedido: ${rc.toLocaleDateString('pt-BR')}</div>`}document.getElementById('start').value=new Date().toISOString().slice(0,10);calc();</script></body></html>
